name: Frontend (manual break-glass fallback)

# Automatic pull-request validation and main deployments are migrating to
# Jenkins. CodeBuild remains active during the cutover; keep this workflow
# dispatch-only as an explicitly invoked break-glass path.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "007761758041"
  ECR_REPOSITORY: infraudit-production-frontend
  ECS_CLUSTER: infraudit-production
  ECS_SERVICE: frontend
  APPLICATION_HEALTH_URL: https://infraudit.com/

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_BASE_URL: ""
          VITE_OAUTH_BACKEND_BASE: ""
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: bash deploy/deploy-frontend_test.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Require production build variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::007761758041:role/infraudit-production-github-frontend
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            VITE_API_BASE_URL=
            VITE_OAUTH_BACKEND_BASE=
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            SUPABASE_PUBLIC_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy frontend to Amazon ECS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          ./deploy/deploy-frontend.sh "$REGISTRY/$ECR_REPOSITORY@$image_digest"

      - name: Verify production frontend
        run: >-
          curl --fail --show-error --silent --location
          --retry 10 --retry-delay 5 --retry-all-errors
          "$APPLICATION_HEALTH_URL" --output /dev/null

      - name: Reconcile Terraform production alias
        run: |
          image_manifest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifest' \
            --output text)"
          test -n "$image_manifest"
          test "$image_manifest" != "None"
          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag production \
            --image-manifest "$image_manifest" \
            --region "$AWS_REGION" >/dev/null
